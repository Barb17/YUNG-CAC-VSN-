    <!-- ================================================================
         JAVASCRIPT E REGISTRAZIONE PWA
         ================================================================ -->
    <script>
        'use strict';

        const PLAY_SVG  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';
        const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>';
        const EMPTY_IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

        function formatTime(s) {
            const m = Math.floor(s / 60);
            return m + ':' + Math.floor(s % 60).toString().padStart(2, '0');
        }

        let allAlbums       = [];
        let artProjects     = [];
        let goycastEpisodes = [];

        // ==========================================
        // GESTIONE SCROLL LOCK & NAV VISIBILITY
        // ==========================================
        const mainNav         = document.getElementById('main-nav');
        const lightbox        = document.getElementById('image-lightbox');
        const lightboxImg     = document.getElementById('lightbox-img');
        const modalBackdrop   = document.getElementById('modal-backdrop');
        const tracklistModal  = document.getElementById('tracklist-modal');
        const tracklistContent = document.getElementById('tracklist-content');
        const playerExpanded  = document.getElementById('player-expanded');

        function syncModalState() {
            const isPlayerOpen    = playerExpanded.classList.contains('active');
            const isTracklistOpen = tracklistModal.classList.contains('active');
            const isLightboxOpen  = lightbox.classList.contains('active');

            mainNav.classList.toggle('hidden-by-player', isPlayerOpen || isTracklistOpen);
            document.body.style.overflow = (isPlayerOpen || isTracklistOpen || isLightboxOpen) ? 'hidden' : '';
        }

        // ==========================================
        // LAZY PRELOAD DEI VIDEO VISIBILI
        // ==========================================
        const mediaObserver = ('IntersectionObserver' in window)
            ? new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const media = entry.target;
                    if (media.getAttribute('preload') === 'none') {
                        media.setAttribute('preload', 'metadata');
                    }
                    obs.unobserve(media);
                });
            }, { rootMargin: '250px 0px' })
            : null;

        function observePageMedia(pageId) {
            const pageEl = document.getElementById('page-' + pageId);
            if (!pageEl) return;
            pageEl.querySelectorAll('video[preload="none"], mux-video[preload="none"]').forEach(media => {
                // Osserva solo i video nella prima slide o nei documentari/episodi singoli
                const slide = media.closest('.carousel-slide');
                if (!slide || !slide.previousElementSibling) {
                    if (mediaObserver) mediaObserver.observe(media);
                    else media.setAttribute('preload', 'metadata');
                }
            });
        }

        // ==========================================
        // SPA ROUTING
        // ==========================================
        const ALL_PAGES = ['snd', 'art', 'goycast'];
        let currentPage = null;

        function navigateTo(page, pushHistory = true) {
            if (!ALL_PAGES.includes(page)) page = 'snd';
            if (page === currentPage) return;
            
            if (currentPage) {
                document.getElementById('page-' + currentPage).classList.remove('active');
            }
            
            currentPage = page;
            document.getElementById('page-' + page).classList.add('active');
            
            document.querySelectorAll('.text-menu a').forEach(a => {
                a.classList.toggle('active', a.dataset.page === page);
            });
            
            if (pushHistory) {
                history.pushState({ page }, '', '#' + page);
            }
            window.scrollTo(0, 0);

            document.querySelectorAll('video, mux-video').forEach(video => video.pause());
            observePageMedia(page);
        }

        document.querySelectorAll('.text-menu a[data-page]').forEach(a => {
            a.addEventListener('click', e => { 
                e.preventDefault(); 
                navigateTo(a.dataset.page, true); 
            });
        });

        window.addEventListener('popstate', e => {
            const page = (e.state && e.state.page) || location.hash.replace('#', '') || 'snd';
            navigateTo(page, false);
        });

        // ==========================================
        // PLAYER AUDIO GLOBALE + MEDIA SESSION API
        // ==========================================
        const globalAudio = new Audio();
        globalAudio.preload = 'metadata';
        let currentAlbumIndex = 0;
        let currentTrackIndex = 0;
        let isPlaying = false;

        const globalPlayerContainer = document.getElementById('global-player-container');
        const barPlayPauseBtn       = document.getElementById('bar-play-pause-btn');
        const globalPlayPauseBtn    = document.getElementById('global-play-pause-btn');
        const globalProgressBar     = document.getElementById('global-progress-bar');
        const globalCurrentTime     = document.getElementById('global-current-time');
        const globalDuration        = document.getElementById('global-duration');
        const barAlbumCover         = document.getElementById('bar-album-cover');
        const barTrackTitle         = document.getElementById('bar-track-title');
        const barAlbumTitle         = document.getElementById('bar-album-title');
        const barTrackArtists       = document.getElementById('bar-track-artists');
        const expAlbumCover         = document.getElementById('expanded-album-cover');
        const expTrackTitle         = document.getElementById('expanded-track-title');
        const expAlbumTitle         = document.getElementById('expanded-album-title');
        const expTrackArtists       = document.getElementById('expanded-track-artists');

        barPlayPauseBtn.innerHTML    = PLAY_SVG;
        globalPlayPauseBtn.innerHTML = PLAY_SVG;

        globalAudio.addEventListener('loadedmetadata', () => {
            globalDuration.textContent = formatTime(globalAudio.duration || 0);
        });

        function loadTrack(albumIndex, trackIndex) {
            const album = allAlbums[albumIndex];
            if (!album || !album.tracks || !album.tracks[trackIndex]) return;
            currentAlbumIndex = albumIndex;
            currentTrackIndex = trackIndex;
            const track = album.tracks[trackIndex];
            
            globalAudio.src = track.src;
            barAlbumCover.src = album.albumCover;
            barTrackTitle.textContent = track.title;
            barAlbumTitle.textContent = album.albumTitle;
            expAlbumCover.src = album.albumCover;
            expTrackTitle.textContent = track.title;
            expAlbumTitle.textContent = album.albumTitle;

            if (album.isSingle) {
                expTrackTitle.style.display = 'none';
                barAlbumTitle.style.display = 'none'; 
            } else {
                expTrackTitle.style.display = 'block';
                barAlbumTitle.style.display = 'block';
            }

            if (album.artists) {
                barTrackArtists.textContent = album.artists;
                barTrackArtists.style.display = 'block';
                expTrackArtists.textContent = album.artists;
                expTrackArtists.style.display = 'block';
                expTrackTitle.style.marginBottom = '5px'; 
                expTrackArtists.style.marginBottom = '20px';
            } else {
                barTrackArtists.style.display = 'none';
                expTrackArtists.style.display = 'none';
                expTrackTitle.style.marginBottom = '20px'; 
            }

            globalPlayerContainer.classList.remove('hidden');
            globalProgressBar.value = 0;
            globalCurrentTime.textContent = '0:00';
            globalDuration.textContent = '0:00';

            if ('mediaSession' in navigator) {
                const mimeType = album.albumCover.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg';
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: album.artists || 'YNGCAC',
                    album: album.albumTitle,
                    artwork: [{ src: album.albumCover, type: mimeType }]
                });
            }
            
            if (isPlaying) playAudio();
        }

        function playAudio() {
            document.querySelectorAll('video, mux-video').forEach(v => v.pause());
            globalAudio.play().catch(() => {});
            isPlaying = true;
            barPlayPauseBtn.innerHTML = PAUSE_SVG;
            globalPlayPauseBtn.innerHTML = PAUSE_SVG;
        }

        function pauseAudio() {
            globalAudio.pause();
            isPlaying = false;
            barPlayPauseBtn.innerHTML = PLAY_SVG;
            globalPlayPauseBtn.innerHTML = PLAY_SVG;
        }

        function togglePlayPause() { isPlaying ? pauseAudio() : playAudio(); }

        function playNextTrack() {
            const currentAlbum = allAlbums[currentAlbumIndex];
            if (!currentAlbum || !currentAlbum.tracks.length) return;
            currentTrackIndex = (currentTrackIndex + 1) % currentAlbum.tracks.length;
            loadTrack(currentAlbumIndex, currentTrackIndex);
        }

        function playPrevTrack() {
            const currentAlbum = allAlbums[currentAlbumIndex];
            if (!currentAlbum || !currentAlbum.tracks.length) return;
            currentTrackIndex = (currentTrackIndex - 1 + currentAlbum.tracks.length) % currentAlbum.tracks.length;
            loadTrack(currentAlbumIndex, currentTrackIndex);
        }

        globalAudio.addEventListener('timeupdate', () => {
            const d = globalAudio.duration || 0;
            globalProgressBar.value = d ? (globalAudio.currentTime / d) * 100 : 0;
            globalCurrentTime.textContent = formatTime(globalAudio.currentTime);
        });

        globalProgressBar.addEventListener('input', () => {
            globalAudio.currentTime = (globalProgressBar.value / 100) * (globalAudio.duration || 0);
        });
        
        globalAudio.addEventListener('ended', playNextTrack);
        
        barPlayPauseBtn.addEventListener('click', togglePlayPause);
        globalPlayPauseBtn.addEventListener('click', togglePlayPause);
        document.getElementById('global-next-btn').addEventListener('click', playNextTrack);
        document.getElementById('global-prev-btn').addEventListener('click', playPrevTrack);

        document.getElementById('open-expanded-player').addEventListener('click', () => {
            playerExpanded.classList.add('active');
            syncModalState();
        });
        document.getElementById('close-expanded-btn').addEventListener('click', () => {
            playerExpanded.classList.remove('active');
            syncModalState();
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', playAudio);
            navigator.mediaSession.setActionHandler('pause', pauseAudio);
            navigator.mediaSession.setActionHandler('previoustrack', playPrevTrack);
            navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
        }

        // ==========================================
        // TRACKLIST MODAL (SND)
        // ==========================================
        function showTracklist(albumIndex) {
            const album = allAlbums[albumIndex];
            if (!album) return;

        tracklistContent.addEventListener('click', e => {

        // ==========================================
        // CAROUSEL & LIGHTBOX (ART / GOYCAST)
        // ==========================================
        function hydrateSlideMedia(slideEl) {
            if (!slideEl) return;
            const img = slideEl.querySelector('img[data-src]');
            if (img) {
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
            }
            const media = slideEl.querySelector('video[preload="none"], mux-video[preload="none"]');
            if (media) {
                media.setAttribute('preload', 'metadata');
            }
        }

        function moveSlide(carouselId, direction) {
            const carousel = document.getElementById(carouselId);
            if (!carousel) return;
            const track = carousel.querySelector('.carousel-track');
            const slides = carousel.querySelectorAll('.carousel-slide');
            if (slides.length <= 1) return;
            const descElement = document.getElementById('desc-' + carouselId); 
            
            carousel.querySelectorAll('video, mux-video').forEach(video => video.pause());
            
            let currentIndex = parseInt(carousel.getAttribute('data-index'), 10) || 0;
            currentIndex = (currentIndex + direction + slides.length) % slides.length;
            
            // Precarica la slide corrente e quelle adiacenti per uno scorrimento fluido
            hydrateSlideMedia(slides[currentIndex]);
            hydrateSlideMedia(slides[(currentIndex + 1) % slides.length]);
            hydrateSlideMedia(slides[(currentIndex - 1 + slides.length) % slides.length]);

            carousel.setAttribute('data-index', currentIndex);
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            if (descElement && slides[currentIndex]) {
                descElement.textContent = slides[currentIndex].getAttribute('data-desc') || '';
            }
        }
        window.moveSlide = moveSlide;

        function closeLightbox() {
            lightbox.classList.remove('active');
            syncModalState();
        }

        document.getElementById('close-lightbox').addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', e => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-content')) closeLightbox();
        });

        lightboxImg.addEventListener('click', function(e) {
            e.stopPropagation(); 
            if (this.classList.contains('zoomed')) {
                this.classList.remove('zoomed');
                this.style.transform = 'scale(1)';
            } else {
                this.classList.add('zoomed');
                const rect = this.getBoundingClientRect();
                const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                const yPercent = ((e.clientY - rect.top) / rect.height) * 100;
                this.style.transformOrigin = `${xPercent}% ${yPercent}%`;
                this.style.transform = 'scale(2.5)'; 
            }
        });

        // Chiusura modali con tasto Escape su Desktop
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (lightbox.classList.contains('active')) closeLightbox();
                else if (tracklistModal.classList.contains('active')) closeTracklistModal();
                else if (playerExpanded.classList.contains('active')) {
                    playerExpanded.classList.remove('active');
                    syncModalState();
                }
            }
        });

        // Event Delegation su ART & GOYCAST (frecce carosello, play video, zoom immagini, swipe touch)
        function setupGalleryDelegation(galleryEl) {
            galleryEl.addEventListener('click', e => {
                const carouselBtn = e.target.closest('.carousel-btn');
                if (carouselBtn && carouselBtn.dataset.carouselId) {
                    moveSlide(carouselBtn.dataset.carouselId, parseInt(carouselBtn.dataset.dir, 10));
                    return;
                }

                const playOverlay = e.target.closest('.custom-play-overlay');
                if (playOverlay) {
                    const wrapper = playOverlay.closest('.video-wrapper');
                    const video = wrapper ? wrapper.querySelector('video, mux-video') : null;
                    if (video) video.play();
                    return;
                }

                const slideImg = e.target.closest('.carousel-slide img');
                if (slideImg) {
                    const src = slideImg.getAttribute('src') || slideImg.dataset.src;
                    if (!src || src === EMPTY_IMG) return;
                    lightboxImg.src = src;
                    lightboxImg.classList.remove('zoomed'); 
                    lightboxImg.style.transform = 'scale(1)'; 
                    lightbox.classList.add('active');
                    syncModalState();
                }
            });

            // Supporto Swipe orizzontale su Mobile per i caroselli
            let touchStartX = 0;
            let touchStartY = 0;
            galleryEl.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            galleryEl.addEventListener('touchend', e => {
                const carousel = e.target.closest('.carousel[id]');
                if (!carousel || e.changedTouches.length !== 1) return;
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) {
                    moveSlide(carousel.id, dx < 0 ? 1 : -1);
                }
            }, { passive: true });
        }

        setupGalleryDelegation(document.getElementById('art-gallery'));
        setupGalleryDelegation(document.getElementById('goycast-gallery'));

        function createSlideElement(slide, slideIndex = 0, totalSlides = 1, isUnreleased = false) {
            const slideDiv = document.createElement('div');
            slideDiv.className = 'carousel-slide';
            if (slide.desc) slideDiv.setAttribute('data-desc', slide.desc);

            // Carica subito la prima slide e quelle adiacenti; differisci le altre nei caroselli lunghi
            const isImmediateNeighbor = (slideIndex <= 1 || slideIndex === totalSlides - 1);

            if (slide.type === 'image') {
                const img = document.createElement('img');
                img.alt = slide.desc || '';
                img.loading = 'lazy';
                img.decoding = 'async';
                if (isImmediateNeighbor) {
                    img.src = slide.src;
                } else {
                    img.src = EMPTY_IMG;
                    img.dataset.src = slide.src;
                }
                slideDiv.appendChild(img);
            } else if (slide.type === 'video' || slide.type === 'mux') {
                const wrapper = document.createElement('div');
                wrapper.className = 'video-wrapper';

                let videoEl;
                if (slide.type === 'video') {
                    videoEl = document.createElement('video');
                    videoEl.controls = true;
                    videoEl.playsInline = true;
                    videoEl.setAttribute('playsinline', '');
                    videoEl.setAttribute('preload', 'none');
                    const source = document.createElement('source');
                    source.src = slide.src;
                    source.type = 'video/mp4';
                    videoEl.appendChild(source);
                } else {
                    videoEl = document.createElement('mux-video');
                    videoEl.setAttribute('controls', '');
                    videoEl.setAttribute('playsinline', '');
                    videoEl.setAttribute('preload', 'none');
                    videoEl.setAttribute('playback-id', slide.playbackId || slide.src);
                }

                const overlay = document.createElement('div');
                overlay.className = 'custom-play-overlay';
                overlay.innerHTML = PLAY_SVG;

                if (!isUnreleased) {
                    videoEl.addEventListener('play', () => {
                        overlay.classList.add('hidden');
                        if (isPlaying) pauseAudio();
                    });
                    videoEl.addEventListener('pause', () => overlay.classList.remove('hidden'));
                }

                wrapper.appendChild(videoEl);
                wrapper.appendChild(overlay);
                slideDiv.appendChild(wrapper);
            }
            return slideDiv;
        }

        // ==========================================
        // RENDER DINAMICO DELLE SEZIONI (Da data.json)
        // ==========================================
        function renderAllSections(data) {
            allAlbums       = (data && data.snd)     || [];
            artProjects     = (data && data.art)     || [];
            goycastEpisodes = (data && data.goycast) || [];

            // 1. Render SND (con DocumentFragment per un singolo reflow)
            const pageSnd = document.getElementById('page-snd');
            const sndFragment = document.createDocumentFragment();

            allAlbums.forEach((album, idx) => {
                const container = document.createElement('div');
                container.className = 'music-container';

                const albumDiv = document.createElement('div');
                albumDiv.className = 'album' + (album.unreleased ? ' unreleased' : '');

                if (album.unreleased) {
                    const soon = document.createElement('div');
                    soon.className = 'soon-overlay';
                    soon.textContent = 'SOON';
                    albumDiv.appendChild(soon);
                }

                const img = document.createElement('img');
                img.src = album.albumCover;
                img.alt = 'Copertina ' + album.albumTitle;
                img.className = 'album-cover-clickable';
                img.dataset.albumIndex = idx;
                img.decoding = 'async';
                if (idx >= 3) img.loading = 'lazy';

                const h3 = document.createElement('h3');
                h3.className = 'album-title-text';
                h3.textContent = album.albumTitle;

                albumDiv.appendChild(img);
                albumDiv.appendChild(h3);
                container.appendChild(albumDiv);
                sndFragment.appendChild(container);
            });
            pageSnd.replaceChildren(sndFragment);

            // 2. Render ART
            const artGallery = document.getElementById('art-gallery');
            const artFragment = document.createDocumentFragment();

            artProjects.forEach((proj, pIdx) => {
                const item = document.createElement('div');
                item.className = 'model-item' + (proj.unreleased ? ' unreleased' : '');

                const h3 = document.createElement('h3');
                h3.className = 'image-title';
                h3.textContent = proj.title;
                item.appendChild(h3);

                if (proj.unreleased) {
                    const soon = document.createElement('div');
                    soon.className = 'soon-overlay';
                    soon.textContent = 'SOON';
                    item.appendChild(soon);
                }

                // Carosello principale
                if (proj.slides && proj.slides.length > 0) {
                    const cId = 'art-carousel-' + pIdx;
                    const cContainer = document.createElement('div');
                    cContainer.className = 'carousel-container';

                    const carousel = document.createElement('div');
                    carousel.className = 'carousel';
                    carousel.id = cId;
                    carousel.setAttribute('data-index', '0');

                    const track = document.createElement('div');
                    track.className = 'carousel-track';
                    const totalSlides = proj.slides.length;
                    proj.slides.forEach((s, sIdx) => {
                        track.appendChild(createSlideElement(s, sIdx, totalSlides, !!proj.unreleased));
                    });

                    if (totalSlides > 1) {
                        const prevBtn = document.createElement('button');
                        prevBtn.className = 'carousel-btn prev';
                        prevBtn.innerHTML = '&#10094;';
                        prevBtn.dataset.carouselId = cId;
                        prevBtn.dataset.dir = '-1';

                        const nextBtn = document.createElement('button');
                        nextBtn.className = 'carousel-btn next';
                        nextBtn.innerHTML = '&#10095;';
                        nextBtn.dataset.carouselId = cId;
                        nextBtn.dataset.dir = '1';

                        carousel.appendChild(prevBtn);
                        carousel.appendChild(track);
                        carousel.appendChild(nextBtn);
                    } else {
                        carousel.appendChild(track);
                    }

                    cContainer.appendChild(carousel);

                    const descP = document.createElement('p');
                    descP.className = 'carousel-description';
                    descP.id = 'desc-' + cId;
                    descP.textContent = proj.initialDesc || proj.slides[0].desc || '';
                    cContainer.appendChild(descP);

                    item.appendChild(cContainer);
                }

                // Documentari / Video aggiuntivi sotto il carosello
                if (proj.documentaries && proj.documentaries.length > 0) {
                    proj.documentaries.forEach(doc => {
                        const docContainer = document.createElement('div');
                        docContainer.className = 'carousel-container';

                        const docCarousel = document.createElement('div');
                        docCarousel.className = 'carousel';
                        docCarousel.appendChild(createSlideElement(doc, 0, 1, !!proj.unreleased));
                        docContainer.appendChild(docCarousel);

                        const docDesc = document.createElement('p');
                        docDesc.className = 'carousel-description';
                        docDesc.textContent = doc.desc || '';
                        docContainer.appendChild(docDesc);

                        item.appendChild(docContainer);
                    });
                }

                artFragment.appendChild(item);
            });
            artGallery.replaceChildren(artFragment);

            // 3. Render GOYCAST
            const goycastGallery = document.getElementById('goycast-gallery');
            const goyFragment = document.createDocumentFragment();

            goycastEpisodes.forEach(ep => {
                const item = document.createElement('div');
                item.className = 'model-item';

                const h3 = document.createElement('h3');
                h3.className = 'image-title';
                h3.textContent = ep.title;
                item.appendChild(h3);

                const cContainer = document.createElement('div');
                cContainer.className = 'carousel-container';

                const carousel = document.createElement('div');
                carousel.className = 'carousel';

                const slideType = ep.videoSrc ? 'video' : 'mux';
                carousel.appendChild(createSlideElement({
                    type: slideType,
                    src: ep.videoSrc || ep.playbackId,
                    playbackId: ep.playbackId
                }, 0, 1, false));

                cContainer.appendChild(carousel);

                const descP = document.createElement('p');
                descP.className = 'carousel-description';
                descP.textContent = ep.date || '';
                cContainer.appendChild(descP);

                item.appendChild(cContainer);
                goyFragment.appendChild(item);
            });
            goycastGallery.replaceChildren(goyFragment);

            if (currentPage) observePageMedia(currentPage);
        }

        // Setup iniziale SPA e caricamento singolo da data.json
        (function initApp() {
            const hash = location.hash.replace('#', '');
            navigateTo(ALL_PAGES.includes(hash) ? hash : 'snd', false);

            fetch('./data.json?t=' + Date.now(), {
                cache: 'no-store',
                headers: { 'Accept': 'application/json' }
            })
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(siteData => {
                renderAllSections(siteData);
            })
            .catch(() => {
                renderAllSections(FALLBACK_SITE_DATA);
            });
        })();

        // ==========================================
        // REGISTRAZIONE SERVICE WORKER (PWA)
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                newWorker.postMessage('SKIP_WAITING');
                            }
                        });
                    });
                }).catch(err => console.error('YNGCAC: registrazione Service Worker fallita', err));
            });
        }
