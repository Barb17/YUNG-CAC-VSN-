<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKED - VSN</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="YNGCAC">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: white;
            color: black;
            font-family: 'IBM Plex Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            flex-direction: column;
        }
        .login-container {
            text-align: center;
            padding: 20px;
        }
        h2 {
            font-size: 1.5em;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        input[type="password"] {
            font-family: inherit;
            padding: 10px;
            font-size: 16px;
            border: 2px solid black;
            border-radius: 0;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            width: 250px;
            transition: box-shadow 0.2s ease;
        }
        input[type="password"]:focus {
            box-shadow: 4px 4px 0px black;
        }
        button {
            font-family: inherit;
            padding: 10px 30px;
            font-size: 16px;
            background-color: black;
            color: white;
            border: 2px solid black;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            font-weight: bold;
            touch-action: manipulation;
        }
        @media (hover: hover) {
            button:hover {
                background-color: white;
                color: black;
            }
        }
        #error-msg {
            color: red;
            margin-top: 15px;
            font-size: 0.9em;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>TYPE PASSWORD</h2>
        <input type="password" id="password-input" autofocus>
        <br>
        <button id="login-btn" type="button">ENTER</button>
        <div id="error-msg">INCORRECT PASSWORD</div>
    </div>

    <script>
        'use strict';

        const passwordInput = document.getElementById('password-input');
        const errorMsg      = document.getElementById('error-msg');
        const loginBtn      = document.getElementById('login-btn');

        function checkPassword() {
            if (passwordInput.value === 'ihatejpeople') {
                sessionStorage.setItem('vsn_authenticated', 'true');
                const redirectUrl = sessionStorage.getItem('vsn_redirect') || 'index.html';
                sessionStorage.removeItem('vsn_redirect');
                window.location.href = redirectUrl;
            } else {
                errorMsg.style.visibility = 'visible';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        loginBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
