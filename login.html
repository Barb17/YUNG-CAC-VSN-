<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKED - VSN</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: white;
            color: black;
            font-family: 'IBM Plex Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            flex-direction: column;
        }
        .login-container {
            text-align: center;
        }
        h2 {
            font-size: 1.5em;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        input[type="password"] {
            font-family: 'IBM Plex Mono', monospace;
            padding: 10px;
            font-size: 16px;
            border: 2px solid black;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            width: 250px;
            transition: box-shadow 0.2s;
        }
        input[type="password"]:focus {
            box-shadow: 4px 4px 0px black;
        }
        button {
            font-family: 'IBM Plex Mono', monospace;
            padding: 10px 30px;
            font-size: 16px;
            background-color: black;
            color: white;
            border: 2px solid black;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: white;
            color: black;
        }
        #error-msg {
            color: red;
            margin-top: 15px;
            font-size: 0.9em;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>TYPE PASSWORD</h2>
        <input type="password" id="password-input" autofocus autocomplete="current-password">
        <br>
        <button type="button" id="login-btn">ENTER</button>
        <div id="error-msg">INCORRECT PASSWORD</div>
    </div>

    <script>
        'use strict';

        // Hash SHA-256 con salt (la password non è mai salvata in chiaro nel codice)
        const AUTH_SALT     = 'vsn_yngcac_salt_v1:';
        const EXPECTED_HASH = '819e34cd66a7a8fce6ee47516533ede4ebc1f7516faca551b3587a6c32dd8e30';

        const passInput = document.getElementById('password-input');
        const errorMsg  = document.getElementById('error-msg');
        const loginBtn  = document.getElementById('login-btn');

        // Fallback SHA-256 puro JS per contesti non-HTTPS (es. apertura locale file://)
        function sha256Fallback(str) {
            const bytes = new TextEncoder().encode(str);
            const K = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];
            let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a,
                h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;

            const bitLen = bytes.length * 8;
            const padLen = ((bytes.length + 9 + 63) & ~63);
            const padded = new Uint8Array(padLen);
            padded.set(bytes);
            padded[bytes.length] = 0x80;
            const view = new DataView(padded.buffer);
            view.setUint32(padLen - 8, Math.floor(bitLen / 0x100000000), false);
            view.setUint32(padLen - 4, bitLen >>> 0, false);

            const W = new Uint32Array(64);
            const rotr = (x, n) => (x >>> n) | (x << (32 - n));

            for (let offset = 0; offset < padLen; offset += 64) {
                for (let i = 0; i < 16; i++) W[i] = view.getUint32(offset + i * 4, false);
                for (let i = 16; i < 64; i++) {
                    const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3);
                    const s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
                    W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
                }
                let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
                for (let i = 0; i < 64; i++) {
                    const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const temp1 = (h + S1 + ch + K[i] + W[i]) | 0;
                    const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const temp2 = (S0 + maj) | 0;
                    h = g; g = f; f = e; e = (d + temp1) | 0;
                    d = c; c = b; b = a; a = (temp1 + temp2) | 0;
                }
                h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
                h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
            }
            return [h0, h1, h2, h3, h4, h5, h6, h7]
                .map(v => (v >>> 0).toString(16).padStart(8, '0'))
                .join('');
        }

        async function computeSha256(str) {
            if (window.crypto && window.crypto.subtle) {
                const buf = new TextEncoder().encode(str);
                const digest = await window.crypto.subtle.digest('SHA-256', buf);
                return Array.from(new Uint8Array(digest))
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
            }
            return sha256Fallback(str);
        }

        async function checkPassword() {
            const hash = await computeSha256(AUTH_SALT + passInput.value);

            if (hash === EXPECTED_HASH) {
                sessionStorage.setItem('vsn_authenticated', EXPECTED_HASH);
                const redirectUrl = sessionStorage.getItem('vsn_redirect') || 'index.html';
                sessionStorage.removeItem('vsn_redirect');
                window.location.href = redirectUrl;
            } else {
                errorMsg.style.visibility = 'visible';
                passInput.value = '';
            }
        }

        loginBtn.addEventListener('click', checkPassword);
        passInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
